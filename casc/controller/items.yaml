removeStrategy:
  rbac: SYNC
  items: NONE
items:
- kind: pipeline
  name: helloWorldPipeline
  concurrentBuild: true
  definition:
    cpsFlowDefinition:
      sandbox: true
      script: |
        pipeline {
            agent none
            stages {
                stage('Hello') {
                    steps {
                        echo 'Hello World'
                    }
                }
            }
        }
    description: 'helloWorldPipeline'
    disabled: false
    displayName: helloWorldPipeline
    resumeBlocked: false