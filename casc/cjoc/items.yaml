removeStrategy:
  rbac: SYNC
  items: NONE
items:
- kind: clientController
  name: ${CONTROLLER_BUNDLE_NAME}
  description: ${CONTROLLER_BUNDLE_NAME}
  displayName: ${CONTROLLER_BUNDLE_NAME}
  properties:
  - configurationAsCode:
      bundle: local/${CONTROLLER_BUNDLE_NAME}
  - sharedHeaderLabelOptIn:
      optIn: true
  - healthReporting:
      enabled: true
  - optOutProperty:
      securityEnforcerOptOutMode:
        optOutNone: {
          }
  - owner:
      delay: 5
      owners: ''
  - envelopeExtension:
      allowExceptions: false
  - sharedConfigurationOptOut:
      optOut: false
  - webSocket:
      enabled: true
- kind: sharedAgent
  name: mySharedAgent
  description: ''
  displayName: mySharedAgent
  labels: mySharedAgent
  launcher:
    inboundAgent:
      webSocket: false
      agentStartupOptions: -webSocket
      workDirSettings:
        remotingWorkDirSettings:
          internalDir: remoting
          disabled: false
          failIfWorkDirIsMissing: false
      vmargs: -Djava.security.debug=jca -Djavax.net.ssl.keyStoreType=PKCS12 -Djavax.net.ssl.trustStoreType=PKCS12  -Djavax.net.debug=ssl,handshake -Djavax.net.ssl.keyStore=/tmp/jenkins.p12  -Djavax.net.ssl.trustStore=/tmp/cacerts  -Djavax.net.ssl.keyStorePassword=changeit -Djavax.net.ssl.trustStorePassword=changeit
  mode: NORMAL
  numExecutors: 1
  remoteFS: /tmp
  retentionStrategy:
    always: {
    }
