removeStrategy:
  rbac: SYNC
  items: NONE
items:
- kind: pipeline
  name: hello-world
  concurrentBuild: true
  definition:
    cpsFlowDefinition:
      sandbox: true
      script: |
        pipeline {
          agent none

          stages {
              stage('Hello') {
                  steps {
                      echo 'Hello World'
                  }
              }
          }
        }
  description: 'Hello World pipeline'
  disabled: false
  displayName: hello-world
  resumeBlocked: false